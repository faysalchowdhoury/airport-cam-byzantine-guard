[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-cam-byzantine-guard"
version = "1.0.0"
description = "Passive-Chain Attestation: bounded-degree visibility rigidity and coverage-weighted blind-time minimization for airport surveillance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S M Tanvir Faysal Alam Chowdhoury" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.1",
  "matplotlib>=3.8",
  "pillow>=10",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["data_pipeline*", "theory*", "models*", "experiments*", "figures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
